services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easymoney}
      POSTGRES_DB: ${POSTGRES_DB:-easymoney}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for local development only: host-based pytest runs and psql
      # debugging. The backend itself always talks to `db:5432` inside the net.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easymoney} -d ${POSTGRES_DB:-easymoney}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easymoney}
      POSTGRES_DB: ${POSTGRES_DB:-easymoney}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-}
      # Required when DEBUG is off (the default): the boot guard refuses to
      # start with an empty or weak secret (A-8). .env.example ships a
      # placeholder so the one-command launch still works; replace it with
      # your own value for anything shared.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      # Off by default (no SQL echo, strict JWT_SECRET guard). Set true for
      # verbose local debugging.
      DEBUG: ${DEBUG:-false}
      # API docs (Swagger at /api/docs) are off by default so deployments do
      # not expose the API surface. Set EXPOSE_API_DOCS=true to enable them.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      # Master switch for all outbound mail; false = never send (log only).
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      # Email-confirmation toggles (active only when SMTP_ENABLED is true).
      EMAIL_REGISTER_CONFIRMATION: ${EMAIL_REGISTER_CONFIRMATION:-false}
      EMAIL_CHANGE_CONFIRMATION: ${EMAIL_CHANGE_CONFIRMATION:-false}
      PASSWORD_CHANGE_CONFIRMATION: ${PASSWORD_CHANGE_CONFIRMATION:-false}
      # Confirmation link lifetime (hours); the email-change "this wasn't me"
      # revert link lifetime (days).
      CONFIRMATION_TOKEN_HOURS: ${CONFIRMATION_TOKEN_HOURS:-24}
      EMAIL_CHANGE_REVERT_DAYS: ${EMAIL_CHANGE_REVERT_DAYS:-2}
      # When false, only the first user can register (then it is closed).
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # Max raw size (MB) of a user avatar upload.
      MAX_AVATAR_MB: ${MAX_AVATAR_MB:-2}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      # App-wide reminder defaults (per-group overrides live in the Settings tab).
      DEBT_OVERDUE_DAYS_DEFAULT: ${DEBT_OVERDUE_DAYS_DEFAULT:-7}
      REMINDER_INTERVAL_DAYS_DEFAULT: ${REMINDER_INTERVAL_DAYS_DEFAULT:-7}
      REMINDER_INTERVAL_DAYS_MIN: ${REMINDER_INTERVAL_DAYS_MIN:-7}
      INVITE_EXPIRY_DAYS: ${INVITE_EXPIRY_DAYS:-7}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # Receipt objects live in an S3-compatible store (LocalStack here; AWS
      # S3 in production). The backend creates the bucket at boot (idempotent).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localstack:4566}
      S3_BUCKET: ${S3_BUCKET:-easymoney-receipts}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Dummy credentials for LocalStack; point at real AWS_* / IAM in prod.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      # Cross-instance event bus + caches (AGENTS.md §3.2). Points at the
      # `redis` service so multiple backend replicas can scale behind the
      # frontend's load balancer. Empty = single-process local mode.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Web Push VAPID keys (AGENTS.md §2.14). Empty = Web Push disabled —
      # the one-command launch works with no setup; the Settings toggle shows
      # the "unsupported" hint. Generate with backend/scripts/generate_vapid.py.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@easymoney.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    # The backend is reached via the frontend on :8081 (nginx proxies /api
    # and /ws here). To expose it directly on the host for curl/debugging,
    # add:
    #   ports:
    #     - "8000:8000"
    healthcheck:
      # The image is python:3.12-slim (no curl/wget), so probe with python.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      # The image is nginx:alpine, so probe with busybox wget. Use 127.0.0.1:
      # inside the container `localhost` resolves to ::1, where nginx does
      # not listen.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP (point SMTP_HOST=mailpit, SMTP_PORT=1025 to use it)

  localstack:
    # S3-compatible object store for receipt files (replaces the old uploads
    # volume). Only the S3 service runs. Ephemeral by design (no volume): fine
    # for dev; point S3_* at real AWS S3 for durable production storage.
    # Pinned to the last Community image (4.14): the 2026 date-versioned
    # "latest" build requires a LOCALSTACK_AUTH_TOKEN license to boot.
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    healthcheck:
      # The image is python-based, so probe the health endpoint with python.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4566/_localstack/health',timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    # Cross-instance event bus + small display caches (AGENTS.md §3.2).
    # Ephemeral by design (no volume): a data loss only means a cold cache and
    # a missed at-most-once push — balances are always recomputed on read.
    # Point REDIS_URL at a managed Redis for durable multi-replica deployments.
    image: redis:7-alpine
    restart: unless-stopped
    # The image declares VOLUME /data, which would make Docker attach an
    # anonymous volume (and an RDB save on stop could persist the lock key
    # across restarts). Mount tmpfs there and disable persistence so /data
    # stays truly ephemeral.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - type: tmpfs
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
