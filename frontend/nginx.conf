# This file is included from the http context (conf.d/default.conf).
# S-4b: log method/URI/status only — never the query string, which carries
# the WS access token (?token=...); the default combined format would leak it.
log_format easymoney "$request_method $uri $server_protocol $status";
access_log /var/log/nginx/access.log easymoney;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (request path is preserved, e.g. /api/health -> /api/health)
    location /api/ {
        # Receipt uploads: keep the app's MAX_UPLOAD_MB check (422) as the
        # effective limit, not nginx's default 1m (which would 413 first).
        client_max_body_size 15m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> backend (path preserved, e.g. /ws?token=... -> /ws?token=...)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
