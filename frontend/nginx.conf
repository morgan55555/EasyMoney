# This file is included from the http context (conf.d/default.conf).
# S-4b: log method/URI/status only — never the query string, which carries
# the WS access token (?token=...); the default combined format would leak it.
log_format easymoney "$request_method $uri $server_protocol $status";
access_log /var/log/nginx/access.log easymoney;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve `backend` at request time (via Docker's embedded DNS) instead of
    # once at config load: a recreated / scaled backend container gets a new
    # IP, and a static `proxy_pass http://backend:8000` would keep the stale
    # one (502s until the frontend is restarted). The variable form forces a
    # lookup on each request, cached for `valid`. This is what makes running
    # multiple backend replicas (AGENTS.md §3.2) a non-event for the frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # API -> backend (request path is preserved, e.g. /api/health -> /api/health)
    location /api/ {
        # Receipt uploads: keep the app's MAX_UPLOAD_MB check (422) as the
        # effective limit, not nginx's default 1m (which would 413 first).
        client_max_body_size 15m;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket -> backend (path preserved, e.g. /ws?token=... -> /ws?token=...)
    location /ws {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Service worker (Web Push, AGENTS.md §2.14): never cached, so a new SW
    # (new push logic) reaches the browser on the next load.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html is the entry point: it names the content-hashed bundles, so a
    # stale cached copy pins the browser to an old app build (old push/WS logic)
    # until a hard reload. Without an explicit header the browser applies
    # *heuristic* caching to it — the bug where a normal reload kept running the
    # old bundle (no reconcilePush, no SW update) and only Ctrl+F5 restored Web
    # Push. no-cache = revalidate on every load, so a normal reload always picks
    # up the newest build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build artifacts: the hash in the filename changes whenever
    # the content does, so they are safe to cache indefinitely (and should be —
    # it keeps reloads fast). A new build emits new hashes, so the browser
    # fetches them fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes (the internal
    # redirect to /index.html re-matches the no-cache location above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
