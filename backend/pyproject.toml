[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easymoney-backend"
version = "1.10"
description = "EasyMoney backend — FastAPI shared-expenses service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "apscheduler>=3.10",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.90",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

# B008 (function call in argument default) is the canonical FastAPI pattern
# for `Depends(...)` / `Query(...)` defaults, so it is exempted where they live.
[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/deps.py" = ["B008"]
"app/core/security.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
